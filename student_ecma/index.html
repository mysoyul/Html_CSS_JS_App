<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학생 관리 시스템 (ECMAScript + Vite)</title>
  </head>
  <body>
    <h1>학생 관리 시스템</h1>

    <div class="form-container">
      <h2>학생 등록</h2>
      <form id="studentForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="name">이름:</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div class="form-group">
            <label for="studentNumber">학번:</label>
            <input type="text" id="studentNumber" name="studentNumber" required />
          </div>

          <div class="form-group">
            <label for="address">주소:</label>
            <input type="text" id="address" name="address" required />
          </div>

          <div class="form-group">
            <label for="phoneNumber">전화번호:</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required />
          </div>

          <div class="form-group">
            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" />
          </div>

          <div class="form-group">
            <label for="dateOfBirth">생년월일:</label>
            <input type="date" id="dateOfBirth" name="dateOfBirth" />
          </div>
        </div>

        <div class="button-group">
          <button type="submit">학생 등록</button>
          <!-- onclick 속성 대신 id 로 찾아 addEventListener 로 연결합니다.
               모듈 안의 함수는 전역이 아니므로 onclick="..." 으로는 부를 수 없습니다. -->
          <button type="button" class="cancel-btn" id="cancelButton" style="display: none">취소</button>
          <span class="error-message" id="formError"></span>
        </div>
      </form>
    </div>

    <div class="table-container">
      <h2>학생 목록</h2>
      <div id="loadingMessage" class="loading" style="display: none">로딩 중...</div>
      <table id="studentTable">
        <thead>
          <tr>
            <th>이름</th>
            <th>학번</th>
            <th>주소</th>
            <th>전화번호</th>
            <th>이메일</th>
            <th>생년월일</th>
            <th>액션</th>
          </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
      </table>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
